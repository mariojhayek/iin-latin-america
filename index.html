#brand-sub{font-size:8px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
#brand-divider{width:1px;height:28px;background:var(--bd)}
#brand-corridor{font-size:12px;font-weight:700;color:var(--gd);font-family:'Libre Baskerville',serif;font-style:italic}
#hdr-controls{display:flex;align-items:center;gap:8px}
#lang-toggle{display:flex;border-radius:6px;border:1.5px solid var(--bd);overflow:hidden}
.lang-btn{padding:4px 10px;background:var(--sf);color:var(--mu);border:none;font-size:10px;font-weight:700}
.lang-btn.active{background:var(--nv);color:#fff}
#corr-select{padding:4px 8px;border-radius:6px;border:1px solid var(--bd);background:var(--wm);font-size:10px;color:var(--nv);font-weight:600}
#nav-tabs{display:flex;padding:0 20px;overflow-x:auto}

.corridor-card.active-corridor .corridor-status{color:var(--gn)}

.stat-n{font-size:22px;font-weight:700;color:var(--nv);font-family:'Libre Baskerville',serif}
.stat-l{font-size:10px;color:var(--mu);margin-top:2px;line-height:1.4}

.how-card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px}
.how-n{font-family:'Roboto Mono',monospace;font-size:11px;color:var(--gd);font-weight:500;margin-bottom:6px}
.how-t{font-family:'Libre Baskerville',serif;font-size:13px;color:var(--nv);margin-bottom:5px}
.how-d{font-size:11px;color:var(--mu);line-height:1.7}

// ── HELPERS ───────────────────────────────────────────────────────────
function tierClass(s){return s>=85?'t1':s>=75?'t2':s>=65?'t3':'t4';}
function tierLabel(s,l){
  const en=['Premier','Strong','Emerging','Exploratory'],es=['Premier','Sólida','Emergente','Exploratoria'];
  const idx=s>=85?0:s>=75?1:s>=65?2:3;
  return (l==='es'?es:en)[idx];
}
function tierBg(s){return s>=85?'#E0F2EB':s>=75?'#DBEAFE':s>=65?'#F7EDD8':'#F3F4F6';}
function tierClr(s){return s>=85?'#2E6B4F':s>=75?'#2C5282':s>=65?'#B5752A':'#6B7280';}
function sharedKw(f1,f2){return f1.k.filter(k=>f2.k.some(k2=>k2.toLowerCase().includes(k.toLowerCase())||k.toLowerCase().includes(k2.toLowerCase())));}
function tx(){return UI[lang];}

// ── LANGUAGE ──────────────────────────────────────────────────────────
function setLang(l){
  lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>{b.classList.toggle('active',b.textContent.startsWith(l.toUpperCase()));});
  document.getElementById('brand-title').textContent=tx().brandTitle;
  document.getElementById('brand-sub').textContent=tx().brandSub;
  const tabs=document.querySelectorAll('.nav-tab');
  tx().tabs.forEach((t,i)=>{if(tabs[i])tabs[i].textContent=t;});
  document.getElementById('footer').innerHTML=`<div>${tx().footer}</div>`;
  renderCurrentPage();
}

// ── NAV ───────────────────────────────────────────────────────────────
function showPage(page,btn){
  if(selectedUni){closeDetail();}
  currentPage=page;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderCurrentPage();
}
function renderCurrentPage(){
  if(currentPage==='overview')renderOverview();
  else if(currentPage==='directory')renderDirectory();
  else if(currentPage==='matrix')renderMatrix();
  else if(currentPage==='faculty')renderFaculty();
}

// ── DIRECTORY ─────────────────────────────────────────────────────────
function renderDirectory(){
  const t=tx();
  const all=[...IIN_IDS,...CBA_IDS].map(id=>({id,isIIN:IIN_IDS.includes(id)})).sort((a,b)=>UNAMES[a.id].localeCompare(UNAMES[b.id]));
  const q=(document.getElementById('dir-search')||{value:''}).value.toLowerCase();
  const shown=all.filter(u=>{
    if(filterIdx===1&&!u.isIIN)return false;
    if(filterIdx===2&&u.isIIN)return false;
    if(!q)return true;
    const fac=FACULTY.filter(f=>f.u===u.id);
    return UNAMES[u.id].toLowerCase().includes(q)||UFULL[u.id].toLowerCase().includes(q)||UREGION[u.id].toLowerCase().includes(q)||fac.some(f=>f.k.some(k=>k.toLowerCase().includes(q)));
  });
  document.getElementById('page-directory').innerHTML=`
    <div class="dir-controls">
      <input id="dir-search" placeholder="${t.searchPlaceholder}" value="${q}" oninput="renderDirectory()" style="flex:1;min-width:160px;padding:8px 12px;border-radius:8px;border:1.5px solid var(--bd);background:var(--sf);font-size:12px;outline:none"/>
      ${t.filters.map((f,i)=>`<button class="filter-btn${filterIdx===i?' active':''}" onclick="setFilter(${i})">${f}</button>`).join('')}
    </div>
    <div id="dir-hint">${shown.length} ${t.dirHint}</div>
    <div class="uni-grid">${shown.map(u=>uniCard(u.id,u.isIIN)).join('')}</div>`;
}
function setFilter(i){filterIdx=i;renderDirectory();}
function uniCard(id,isIIN){
  const fac=FACULTY.filter(f=>f.u===id);
  const topKw=[...new Set(fac.flatMap(f=>f.k))].slice(0,4);
  const ac=isIIN?'var(--nv)':'var(--gk)';
  const bg=isIIN?'var(--nl)':'var(--gl)';
  const t=tx();
  return `<div class="uni-card" onclick="selectUni('${id}')">
    <div class="uni-card-top">
      <div><div class="uni-abbr">${UNAMES[id]}</div><div class="uni-tag" style="color:${ac}">${isIIN?t.iinTag:t.cbaTag}</div></div>
      <div class="uni-count" style="background:${bg};color:${ac}">${fac.length} ${t.researchers}</div>
    </div>
    <div class="uni-region">${UREGION[id]}</div>
    <div class="pills">${topKw.map(k=>`<span class="pill${isIIN?'':' pill-gold'}">${k}</span>`).join('')}</div>
  </div>`;
}

  const legend=t.tiers.map((l,i)=>`<div class="leg-item" style="background:${legColors[i][1]};color:${legColors[i][0]};border-color:${legColors[i][0]}44"><div style="width:8px;height:8px;border-radius:2px;background:${legColors[i][0]}"></div>${l}</div>`).join('');

  const rows=IIN_ALPHA.map((r,ri)=>{

  }).join('');
  document.getElementById('page-matrix').innerHTML=`

    <div class="matrix-wrap"><table><thead><tr><th style="text-align:left;border-right:1px solid rgba(255,255,255,.2);border-left:none">IIN</th>${colHeaders}</tr></thead><tbody>${rows}</tbody></table></div>

  if(!q.trim()){el.innerHTML='';return;}
  const ql=q.toLowerCase();
  const matchF=f=>f.k.some(k=>k.toLowerCase().includes(ql)||ql.includes(k.toLowerCase()))||f.d.toLowerCase().includes(ql)||f.n.toLowerCase().includes(ql);
  const iinF=FACULTY.filter(f=>IIN_IDS.includes(f.u)&&matchF(f)).sort(byLast).slice(0,8);
  const cbaF=FACULTY.filter(f=>CBA_IDS.includes(f.u)&&matchF(f)).sort(byLast).slice(0,8);
  if(!iinF.length&&!cbaF.length){el.innerHTML=`<div class="no-results">${t.noResults}</div>`;return;}
  const pairs=[];
  iinF.forEach(f1=>cbaF.forEach(f2=>{const sh=sharedKw(f1,f2);if(sh.length)pairs.push({f1,f2,sh});}));
  pairs.sort((a,b)=>b.sh.length-a.sh.length);
  let html='<div style="margin-top:14px">';
  if(pairs.length){
    html+=`<div class="shead">${t.pairsLabel} (${Math.min(pairs.length,8)})</div><div class="pairs-grid">`;
    pairs.slice(0,8).forEach(({f1,f2,sh})=>{
      html+=`<div class="pair-card">
        <div class="pair-row"><div><div class="pair-name1">${f1.n}</div><div class="pair-uni1">${UNAMES[f1.u]} · ${f1.d}</div></div><div class="pair-arrow">↔</div><div><div class="pair-name2">${f2.n}</div><div class="pair-uni2">${UNAMES[f2.u]} · ${f2.d}</div></div></div>
        <div class="shared-row"><span class="shared-label">${t.sharedResearch}</span>${sh.map(k=>`<span class="pill pill-gold">${k}</span>`).join('')}</div>
      </div>`;
    });
    html+='</div>';
  }
  if(iinF.length||cbaF.length){
    html+=`<div class="res-cols">`;
    html+=`<div><div class="res-col-title" style="color:var(--nm)">${t.iinRes} (${iinF.length})</div>${iinF.map(f=>facCard(f,ql,true)).join('')}</div>`;
    html+=`<div><div class="res-col-title" style="color:var(--gk)">${t.cbaRes} (${cbaF.length})</div>${cbaF.map(f=>facCard(f,ql,false)).join('')}</div>`;
    html+='</div>';
  }
  html+='</div>';
  el.innerHTML=html;
}
function facCard(f,ql,isIIN){
  const ac=isIIN?'var(--nm)':'var(--gk)';
  const bg=isIIN?'var(--nl)':'var(--gl)';
  return `<div class="fac-card">
    <div class="fac-top"><div><div class="fac-name">${f.n}</div><div class="fac-uni" style="color:${ac}">${UNAMES[f.u]} · ${f.d}</div></div><div class="fac-h" style="background:${bg};color:${ac}">h=${f.h}</div></div>
    <div class="pills">${f.k.map(k=>`<span class="pill${(!isIIN||k.toLowerCase().includes(ql))?isIIN?'':' pill-gold':''}">${k}</span>`).join('')}</div>
  </div>`;
}

// ── DETAIL VIEW ───────────────────────────────────────────────────────
let detailTab='faculty';
function selectUni(id){
  selectedUni=id;
  const isIIN=IIN_IDS.includes(id);
  const ac=isIIN?'var(--nv)':'var(--gk)';
  const bg=isIIN?'var(--nl)':'var(--gl)';
  const t=tx();
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const dv=document.getElementById('detail-view');
  dv.classList.add('active');
  detailTab='faculty';
  renderDetail();
}
function renderDetail(){
  const id=selectedUni;
  const isIIN=IIN_IDS.includes(id);
  const ac=isIIN?'var(--nv)':'var(--gk)';
  const bg=isIIN?'var(--nl)':'var(--gl)';
  const t=tx();
  const fac=FACULTY.filter(f=>f.u===id).sort(byLast);
  const matrixRow=isIIN
    ?Object.entries(MATRIX[id]).sort((a,b)=>b[1]-a[1])
    :IIN_IDS.map(r=>[r,MATRIX[r][id]]).sort((a,b)=>b[1]-a[1]);
  let body='';
  if(detailTab==='faculty'){
    body=`<div class="shead">${t.tabFaculty} — ${UNAMES[id]}</div>${fac.map(f=>`<div class="fac-card"><div class="fac-top"><div><div class="fac-name">${f.n}</div><div class="fac-uni" style="color:${ac}">${f.d}</div></div><div class="fac-h" style="background:${bg};color:${ac}">h=${f.h}</div></div><div class="pills">${f.k.map(k=>`<span class="pill${isIIN?'':' pill-gold'}">${k}</span>`).join('')}</div></div>`).join('')}`;
  } else {
    const tierKey=[['85%+','var(--t1c)','var(--t1b)'],['75–84%','var(--t2c)','var(--t2b)'],['65–74%','var(--t3c)','var(--t3b)'],['<65%','var(--t4c)','var(--t4b)']];
    const legend=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:12px;font-size:8px;font-weight:700">${tierKey.map(([r,c,b])=>`<div style="background:${b};color:${c};border-radius:4px;padding:4px 5px;text-align:center;border:1px solid ${c}33">${r}</div>`).join('')}</div>`;
    body=`<div class="shead">${t.allMatches}</div>${legend}${matrixRow.map(([mid,s])=>`<div class="match-row" style="background:${tierBg(s)};border-color:${tierClr(s)}33"><div><span class="match-name">${UNAMES[mid]}</span><span class="match-reg">${UREGION[mid]}</span></div><span class="tier ${tierClass(s)}">${s}% · ${tierLabel(s,lang)}</span></div>`).join('')}`;
  }
  document.getElementById('detail-view').innerHTML=`
    <div class="detail-hdr" style="background:linear-gradient(135deg,${isIIN?'rgba(27,58,92,0.07)':'rgba(139,90,30,0.07)'},transparent);border-bottom:1px solid var(--bd)">
      <button class="detail-back" style="color:${ac}" onclick="closeDetail()">← ${isIIN?t.iinLabel:t.cbaLabel}</button>
      <div class="detail-abbr">${UNAMES[id]}</div>
      <div class="detail-full" style="color:${ac}">${UFULL[id]}</div>
      <div class="detail-region">${UREGION[id]}</div>
      <div class="detail-hub" style="background:${bg};color:${ac};border-color:${ac}33">${UHUB[id]}</div>
    </div>
    <div class="detail-tabs">
      <button class="detail-tab${detailTab==='faculty'?' active':''} ${isIIN?'':'active-gold'}" onclick="switchDetailTab('faculty')">${t.tabFaculty} (${fac.length})</button>
      <button class="detail-tab${detailTab==='matches'?' active':''} ${isIIN?'':'active-gold'}" onclick="switchDetailTab('matches')">${t.tabMatches}</button>
    </div>
    <div class="detail-body">${body}</div>`;
}
function switchDetailTab(tab){detailTab=tab;renderDetail();}
function closeDetail(){
  selectedUni=null;detailTab='faculty';
  document.getElementById('detail-view').classList.remove('active');
  document.getElementById('page-'+currentPage).classList.add('active');
}

// ── INIT ──────────────────────────────────────────────────────────────
document.getElementById('brand-title').textContent=UI.en.brandTitle;
document.getElementById('brand-sub').textContent=UI.en.brandSub;
document.getElementById('footer').innerHTML=`<div>${UI.en.footer}</div>`;
renderOverview();
</script>
